[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slopdet"
version = "0.1.0"
description = "Is This AI Slop? (ITAIS) — named why-slop / why-human hits plus an AI-pile resemblance score."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vstaln" }]
dependencies = [
  "pyyaml>=6.0",
  "regex>=2024.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = [
  "torch>=2.0",
  "transformers>=5.15",  # LFM2 encoder path verified on 5.15.0
  "accelerate>=0.30",
  "bitsandbytes>=0.43",
  "datasets>=2.19",
  "safetensors>=0.4",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "peft>=0.11",
]
export = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxscript>=0.1",
]

[project.scripts]
slopdet = "slopdet.cli:main"
itais = "slopdet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slopdet = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
